<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Random Number Generator</h1>
        <div class="input-section">
            <label for="min">Minimum:</label>
            <input type="number" id="min" placeholder="Enter the minimum number"> <br>
            <span class="errorMessage"></span>
            <br>
            <label for="max">Maximum:</label>
            <input type="number" id="max" placeholder="Enter the maximum number">
            <span class="errorMessage"></span>
        </div>
        <button id="generate">Generate Random Number</button>
        <div class="result">
            <p id="randomNumber">Click the button to  generate number</p>
        </div>
        <button id="reset">Reset</button>
    </div>
    
    
    <script src="script.js"></script>
</body>
</html>
